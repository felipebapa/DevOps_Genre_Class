name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Configurar Python
        run: uv python install

      - name: Instalar dependencias
        run: uv sync --all-extras

      - name: Lint con ruff
        run: uv run ruff check .
 #       continue-on-error: true

      - name: Verificar que los módulos importan sin errores
        run: |
          uv run python -c "import src.preprocessing"
          uv run python -c "import src.model_utils"

      - name: Ejecutar pruebas (pytest)
        run: uv run pytest -v
 #       continue-on-error: true

      - name: Analizar código con SonarQube
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Exportar dependencias para Snyk
        run: |
          uv export \
            --format requirements-txt \
            --all-extras \
            --no-hashes \
            --no-emit-project \
            --output-file requirements-snyk.txt

      - name: Preparar dependencias para Snyk
        run: |
          python -m pip install -r requirements-snyk.txt
          python -m pip install cffi pycparser watchdog

      - name: Instalar Snyk
        run: |
          npm install -g snyk
          snyk --version

      - name: Analizar vulnerabilidades con Snyk
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements-snyk.txt \
            --package-manager=pip \
            --command=$(which python) \
            --severity-threshold=high